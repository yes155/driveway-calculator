name: Verify site
on:
  push:
  pull_request:
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Laptop and phone calculator placement
        run: node --import tsx scripts/check-layout.mjs
      - name: Keep workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-layout-checks
          path: .layout-checks
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Mobile performance budgets
        run: npx lhci autorun
      - name: Keep mobile Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static-export
          path: out
